services:
  - type: web
    name: girl-safety-system
    env: docker
    dockerfilePath: ./backend/Dockerfile
    port: 5000
    plan: free
    healthCheckPath: /health
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 5000
      - key: MONGO_URI
        sync: false
      - key: JWT_SECRET
        sync: false
      - key: FRONTEND_URL
        sync: false
      - key: AI_SERVICE_URL
        value: "http://localhost:5001"
